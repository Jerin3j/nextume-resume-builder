services:
  backend:
    build: ./server
    container_name: resume-backend
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    restart: always

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: resume-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend